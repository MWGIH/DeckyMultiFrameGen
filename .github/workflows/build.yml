name: Build

on:
  push:
    # test/** and claude/** branches publish a test build as the "test" prerelease (see below)
    branches: [main, "test/**", "claude/**"]
    tags: ["v*"]
  pull_request:
  # started by mako-update.yml after it brings in a new MAKO release (its own push can't start this workflow)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      # A test build says so in Decky: <version>-test.<run>, never newer than the next real release
      - name: Mark a test build's version
        if: github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        run: node -e 'const f="package.json",p=require("./"+f);p.version+="-test."+process.env.GITHUB_RUN_NUMBER;require("fs").writeFileSync(f,JSON.stringify(p,null,2)+"\n")'
      - run: pnpm typecheck
      - run: python -m unittest discover -s tests -v
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: Decky-MultiFrameGen
          path: out/Decky-MultiFrameGen.zip
      # A push to main whose package.json version has no release yet publishes one, so the plugin can be
      # installed from https://github.com/MWGIH/DeckyMultiFrameGen/releases/latest/download/Decky-MultiFrameGen.zip
      # Pushing a v* tag (or creating a release on GitHub) attaches the ZIP to that release instead.
      # Any other branch replaces the "test" prerelease, installable from
      # https://github.com/MWGIH/DeckyMultiFrameGen/releases/download/test/Decky-MultiFrameGen.zip
      # (prereleases never become releases/latest, so normal installs and the plugin's update check ignore it)
      - name: Publish test build
        if: github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release delete test --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create test out/Decky-MultiFrameGen.zip --prerelease --target "$GITHUB_SHA" \
            --title "Test build $version ($GITHUB_REF_NAME)" \
            --notes "Test build of branch $GITHUB_REF_NAME at $GITHUB_SHA. Not a release: install it only to test."
      - name: Publish release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              gh release upload "$tag" out/Decky-MultiFrameGen.zip --clobber
            else
              echo "Release $tag already exists; bump the version in package.json to publish a new one."
            fi
          else
            gh release create "$tag" out/Decky-MultiFrameGen.zip --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
