name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: python -m unittest discover -s tests -v
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: Decky-MultiFrameGen
          path: out/Decky-MultiFrameGen.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # works whether the tag was pushed on its own or created with a release on GitHub
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/Decky-MultiFrameGen.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/Decky-MultiFrameGen.zip --title "$GITHUB_REF_NAME" --generate-notes
          fi
