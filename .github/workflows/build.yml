name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # started by mako-update.yml after it brings in a new MAKO release (its own push can't start this workflow)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: python -m unittest discover -s tests -v
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: Decky-MultiFrameGen
          path: out/Decky-MultiFrameGen*.zip
      # A push to main whose package.json version has no release yet publishes one, so the plugin can be
      # installed from https://github.com/MWGIH/DeckyMultiFrameGen/releases/latest/download/Decky-MultiFrameGen.zip
      # Pushing a v* tag (or creating a release on GitHub) attaches the ZIP to that release instead.
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              gh release upload "$tag" out/Decky-MultiFrameGen*.zip --clobber
            else
              # Only adds ZIPs the release doesn't have yet (the device-named ones on releases made before they existed)
              have="$(gh release view "$tag" --json assets --jq '.assets[].name')"
              for zip in out/Decky-MultiFrameGen*.zip; do
                if ! grep -qxF "$(basename "$zip")" <<<"$have"; then gh release upload "$tag" "$zip"; fi
              done
              echo "Release $tag already exists; bump the version in package.json to publish a new one."
            fi
          else
            gh release create "$tag" out/Decky-MultiFrameGen*.zip --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
